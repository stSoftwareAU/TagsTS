name: Publish

on:
  push:
    branches:
      - Develop

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # The OIDC ID token is used for authentication with JSR.
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      # Issue #40: publish with a pinned Deno rather than `npx jsr publish`, so
      # no registry-latest npm package executes with the OIDC token in scope.
      - uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282 # v2.0.4
        with:
          deno-version: v2.9.6
      - run: deno publish
