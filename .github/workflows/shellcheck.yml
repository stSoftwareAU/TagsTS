name: ShellCheck

on:
  pull_request:
    # Draft PRs are work in progress (owner, 2026-10-23): CI runs
    # once, when the PR is marked ready.
    types: [opened, synchronize, reopened, ready_for_review]
    # "*" does not match "/", so milestone/* is listed explicitly to
    # ensure milestone sub-issue PRs are checked (Issue #94).
    branches: ["*", "milestone/*"]
  push:
    branches: [main, master, Develop]

permissions:
  contents: read

jobs:
  shellcheck:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # actions/checkout@v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      # ludeeus/action-shellcheck pinned to commit SHA (Issue #20)
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@00b27aa7cb85167568cb48a3838b75f4265f2bca
        with:
          scandir: .
          severity: warning
