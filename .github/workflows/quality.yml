name: Format Code Automatically with Deno 2

on:
  push:
    branches-ignore:
      - Develop
  workflow_dispatch: # Allow manual trigger if needed

permissions:
  contents: write # The job commits and pushes fmt/lint fixes back to the branch.

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Checkout the code.
      #
      # `persist-credentials: false` — the default would write
      # `secrets.ACTIONS_PUSH` (a privileged PAT) into `.git/config`, where the
      # `deno test --allow-all` step and any dependency it executes could read
      # it (Issue #37). The PAT is re-introduced only at the push step.
      - name: Checkout Code
        # actions/checkout@v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          token: ${{ secrets.ACTIONS_PUSH }}
          persist-credentials: false

      # Set up Deno 2.x
      - name: Setup Deno
        # denoland/setup-deno@v2.0.4
        uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282

      # Adopt new dependency versions, subject to the supply-chain quarantine
      # declared by "minimumDependencyAge" in deno.json (Issue #36): a version
      # published less than 24 hours ago is refused, so a hijacked release
      # cannot be pulled in, executed by the test step below, and auto-pushed
      # before anyone has a chance to notice it. Internal @stsoftware/* scopes
      # are exempt from the wait. Never pass --min-dep-age here — the flag
      # overrides deno.json and would silently disable the gate.
      - name: Update Deno
        run: deno outdated --update --latest

      # Run Deno fmt
      - name: Format Code
        run: deno fmt

      - name: Lint Code
        run: deno lint --fix

      - name: Check
        run: |
          set -euo pipefail
          deno check

      # Issue #38: tests run freshly updated dependencies, so grant least
      # privilege — no net/run/env (no exfiltration or git), writes confined
      # to the runner temp dir so tracked files cannot be tampered with.
      - name: Test
        run: |
          set -euo pipefail
          export TMPDIR="$RUNNER_TEMP"
          deno test --allow-read=".,$RUNNER_TEMP" --allow-write="$RUNNER_TEMP" --reporter=dot test/*.ts

      # Check for Changes
      - name: Check for Changes
        id: check_changes # Define step ID to use outputs
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      # Commit Changes
      - name: Commit Changes
        if: steps.check_changes.outputs.has_changes == 'true' # Use step output
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: apply deno fmt and lint fixes"

      # Push Changes — the PAT arrives through env: and is used via a
      # per-command extraheader, so it never lives in `.git/config`.
      - name: Push Changes
        if: steps.check_changes.outputs.has_changes == 'true' # Use step output
        env:
          GH_PAT: ${{ secrets.ACTIONS_PUSH }}
        run: |
          set -euo pipefail
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_PAT" | base64 -w0)"
          git -c http.https://github.com/.extraheader="$AUTH_HEADER" push origin
