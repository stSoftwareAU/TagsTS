name: Markdown Lint

on:
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # actions/checkout@v5
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      # actions/setup-node@v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "lts/*"
      - name: Install markdownlint-cli2
        run: npm install -g markdownlint-cli2@0.23.3
      - name: Run markdownlint-cli2
        run: markdownlint-cli2
      # Optional: mirror the local check-mermaid quality gate when Deno
      # and the worker module are available in the repo (Issue #1683).
      - name: Detect Deno worker module
        id: detect-deno
        run: |
          set -euo pipefail
          if [ -f worker/deno/mod.ts ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      # denoland/setup-deno@v2.0.4
      - if: steps.detect-deno.outputs.present == 'true'
        id: setup-deno
        uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282
        with:
          deno-version: v2.x
      # Cache downloaded modules on an exact key — Deno version plus the
      # deno.json hash, no restore-keys — so any deno.json change misses
      # cleanly (Issue #76). setup-deno's `cache: true` always falls back to
      # a broad prefix key, so it is not used.
      - if: steps.detect-deno.outputs.present == 'true'
        name: Cache Deno dependencies
        # actions/cache@v6.1.0
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/deno
          key: deno-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup-deno.outputs.deno-version }}-${{ hashFiles('deno.json') }}
      - if: steps.detect-deno.outputs.present == 'true'
        name: Validate Mermaid blocks
        run: deno run --allow-read --allow-env=DEBUG,LOG_LEVEL,CONFIG_PATH,OUTPUT_JSON worker/deno/mod.ts check-mermaid
