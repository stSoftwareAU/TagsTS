name: Semgrep

# SAST scanning on pull requests using Semgrep.
#
# Mirrors the canonical NEAT-AI pattern at
# stSoftwareAU/NEAT-AI/.github/workflows/semgrep.yml. The container
# image is pinned to a digest so a hijacked tag cannot exfiltrate
# SEMGREP_APP_TOKEN (Issue #18).

on:
  pull_request:
    # "**" also matches milestone/<slug>; "*" stops at "/" (Issue #67).
    branches: ["**"]

permissions:
  contents: read

jobs:
  semgrep:
    name: Semgrep SAST scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      # semgrep/semgrep 1.163.0 (multi-arch OCI index digest; tag resolved
      # from the digest via the Docker Hub registry, Issue #74). The tag lets
      # Renovate track bumps; the digest still pins the exact image.
      # Pinned to close the supply-chain hole on SEMGREP_APP_TOKEN.
      # Bump alongside dependabot/renovate updates; quarantine policy: 24h.
      image: semgrep/semgrep:1.163.0@sha256:7cad2bc2d1e44f87f0bf4be6d1fa23aa90fb72015bebc89fb91385d813987a03
    steps:
      # actions/checkout@v4.3.1
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - run: semgrep ci --config p/default --config p/security-audit --config p/owasp-top-ten
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
