name: "Check spelling"
on: # rebuild any PRs
  pull_request:

# Least privilege: the job only reads the checked-out files (Issue #59).
permissions:
  contents: read

jobs:
  spellcheck: # run the action
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: streetsidesoftware/cspell-action@e464ae97d348eb3beb0c5a6296dc4388ad4484d9 # v6.11.1
        with:
          # Specify the files to check
          files: "**/*.{md,html,js,ts,css}"
          config: ".github/workflows/cspell.json"
