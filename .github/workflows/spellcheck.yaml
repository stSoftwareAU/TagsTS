name: "Check spelling"
on: # rebuild any PRs
  pull_request:
    # Draft PRs are work in progress (owner, 2026-10-23): CI runs
    # once, when the PR is marked ready.
    types: [opened, synchronize, reopened, ready_for_review]

# Least privilege: the job only reads the checked-out files (Issue #59).
permissions:
  contents: read

jobs:
  spellcheck: # run the action
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: streetsidesoftware/cspell-action@6f3c77c1406bc930f944ba97e9801a22e42caf58 # v9.1.0
        with:
          # Specify the files to check
          files: "**/*.{md,html,js,ts,css}"
          config: ".github/workflows/cspell.json"
