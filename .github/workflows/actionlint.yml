name: actionlint

# Lints every workflow (with shellcheck on `run:` blocks) so workflow
# regressions fail the pull request (Issue #58).

on:
  pull_request:
    # Draft PRs are work in progress (owner, 2026-10-23): CI runs
    # once, when the PR is marked ready.
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  actionlint:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      # rhysd/actionlint:1.7.12 (bundles shellcheck), pinned to its image digest.
      # Run from a `run:` step rather than `uses: docker://…`: the repo's
      # Actions allowlist rejects docker:// references (they can never be
      # pinned to a commit SHA), which made the job a silent startup_failure.
      - name: Run actionlint
        run: |
          set -euo pipefail
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" -w /repo \
            rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -color
